lexer_target: dsl
version: 1.0.0
delimiters: " \t\n"
delimiter_check_for_types:
  - command
tokens:
  - type: command
    value: "PRINT"
  - type: command
    value: "SET"
  - type: string_literal
    pattern: '"[^"]*"'
  - type: identifier
    pattern: "[a-zA-Z_][a-zA-Z0-9_]*"
  - type: whitespace
    pattern: "\\s+"
