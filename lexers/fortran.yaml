lexer_target: fortran
version: 1.0.0
delimiters: " \t\n\r;(){}[],+-*/%&|^!<>?:='\""
delimiter_check_for_types:
  - keyword
  - identifier
  - number
tokens:
  # **Comments** (Placed first)
  - type: comment
    pattern: "!.*"
  - type: comment
    pattern: "^[cC].*"

  # **String Literals** (Before operators and punctuators)
  - type: string_literal
    pattern: "'([^']|'')*'"
  - type: string_literal
    pattern: "\"([^\"]|\"\")*\""

  # **Operators** (Multi-character operators before single-character ones)
  - type: operator
    value: "**"
  - type: operator
    value: "//"
  - type: operator
    value: "=="
  - type: operator
    value: "/="
  - type: operator
    value: ">="
  - type: operator
    value: "<="
  - type: operator
    value: "="
  - type: operator
    value: "+"
  - type: operator
    value: "-"
  - type: operator
    value: "*"
  - type: operator
    value: "/"
  - type: operator
    value: "<"
  - type: operator
    value: ">"
  - type: operator
    value: ".EQ."
  - type: operator
    value: ".NE."
  - type: operator
    value: ".LT."
  - type: operator
    value: ".LE."
  - type: operator
    value: ".GT."
  - type: operator
    value: ".GE."
  - type: operator
    value: ".AND."
  - type: operator
    value: ".OR."
  - type: operator
    value: ".NOT."

  # **Punctuators**
  - type: punctuator
    value: "("
  - type: punctuator
    value: ")"
  - type: punctuator
    value: ","
  - type: punctuator
    value: ":"
  - type: punctuator
    value: ";"

  # **Keywords** (Before identifiers) - uppercase
  - type: keyword
    value: "PROGRAM"
  - type: keyword
    value: "END"
  - type: keyword
    value: "FUNCTION"
  - type: keyword
    value: "SUBROUTINE"
  - type: keyword
    value: "CALL"
  - type: keyword
    value: "RETURN"
  - type: keyword
    value: "IF"
  - type: keyword
    value: "THEN"
  - type: keyword
    value: "ELSE"
  - type: keyword
    value: "ENDIF"
  - type: keyword
    value: "DO"
  - type: keyword
    value: "CONTINUE"
  - type: keyword
    value: "STOP"
  - type: keyword
    value: "INTEGER"
  - type: keyword
    value: "REAL"
  - type: keyword
    value: "DOUBLE PRECISION"
  - type: keyword
    value: "COMPLEX"
  - type: keyword
    value: "LOGICAL"
  - type: keyword
    value: "CHARACTER"
  - type: keyword
    value: "DIMENSION"
  - type: keyword
    value: "ALLOCATABLE"
  - type: keyword
    value: "ALLOCATE"
  - type: keyword
    value: "DEALLOCATE"
  - type: keyword
    value: "PARAMETER"
  - type: keyword
    value: "IMPLICIT"
  - type: keyword
    value: "NONE"
  - type: keyword
    value: "PRINT"
  - type: keyword
    value: "READ"
  - type: keyword
    value: "WRITE"
  - type: keyword
    value: "FORMAT"
  - type: keyword
    value: "GOTO"
  - type: keyword
    value: "PAUSE"
  - type: keyword
    value: "DATA"
  - type: keyword
    value: "MODULE"
  - type: keyword
    value: "USE"
  - type: keyword
    value: "INTERFACE"
  - type: keyword
    value: "OPERATOR"
  - type: keyword
    value: "CONTAINS"
  # **Keywords** - lowercase (Fortran is case-insensitive)
  - type: keyword
    value: "program"
  - type: keyword
    value: "end"
  - type: keyword
    value: "function"
  - type: keyword
    value: "subroutine"
  - type: keyword
    value: "call"
  - type: keyword
    value: "return"
  - type: keyword
    value: "if"
  - type: keyword
    value: "then"
  - type: keyword
    value: "else"
  - type: keyword
    value: "endif"
  - type: keyword
    value: "do"
  - type: keyword
    value: "continue"
  - type: keyword
    value: "stop"
  - type: keyword
    value: "integer"
  - type: keyword
    value: "real"
  - type: keyword
    value: "double precision"
  - type: keyword
    value: "complex"
  - type: keyword
    value: "logical"
  - type: keyword
    value: "character"
  - type: keyword
    value: "dimension"
  - type: keyword
    value: "allocatable"
  - type: keyword
    value: "allocate"
  - type: keyword
    value: "deallocate"
  - type: keyword
    value: "parameter"
  - type: keyword
    value: "implicit"
  - type: keyword
    value: "none"
  - type: keyword
    value: "print"
  - type: keyword
    value: "read"
  - type: keyword
    value: "write"
  - type: keyword
    value: "format"
  - type: keyword
    value: "goto"
  - type: keyword
    value: "pause"
  - type: keyword
    value: "data"
  - type: keyword
    value: "module"
  - type: keyword
    value: "use"
  - type: keyword
    value: "interface"
  - type: keyword
    value: "operator"
  - type: keyword
    value: "contains"

  # **Identifiers**
  - type: identifier
    pattern: "[a-zA-Z][a-zA-Z0-9_]*"

  # **Numeric Literals**
  - type: number
    pattern: "\\b\\d+(\\.\\d+)?([eEdD][+-]?\\d+)?\\b"

  # **Whitespace**
  - type: whitespace
    pattern: "\\s+"

  # **Unknown Tokens**
  - type: unknown
    pattern: "."
